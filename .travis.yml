language: generic
branches:
  only:
    - master
install:
  - echo ${TRAVIS_COMMIT_RANGE:=$TRAVIS_BRANCH..FETCH_HEAD}
  - sudo add-apt-repository -y ppa:cassou/emacs
  - sudo apt-get update -qq
  - sudo apt-get install -qq emacs-snapshot-nox
  - emacs --version
  - emacs-snapshot --version
script:
  - echo $xx
  - echo "$TRAVIS_BRANCH, $TRAVIS_COMMIT, $TRAVIS_COMMIT_RANGE"
  - echo "$BASH_VERSION"
  - exit 0
  - git diff "$TRAVIS_COMMIT_RANGE"

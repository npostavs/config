# /etc/keyd/keyd.conf
[ids]
*

# Annoying messed function key bindings of the HP USB Keyboard:
#
# f9/look = Shift+Meta+F21
# f10/boxes thing = Meta+Tab
#   The boxes thing is probably supposed to mean switch windows.
# f11/screen ipod? = Contrl+Meta+F21
#   Probably ipod = "Devices"
# f12/gear = Meta+F21

# I want reverse them, so that F<n> is the default instead of having
# to press fn+F<n> to get them.

[main]
f9  = find
f10 = cyclewindows
f11 = media
f12 = config

# We get some extra control+shift on f9 and f11, but seems too
# difficult to remove completely.
leftmeta+tab = f10
[meta]
f21 = f12
[meta+shift]
f21 = f9
[meta+control]
f21 = f11

#!/usr/sbin/nft -f

flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter;
        policy drop;

        # Allow loopback
        iif lo accept

        # Drop invalid packets
        ct state invalid drop

        # Allow established and related connections
        ct state { established, related } accept

        # Allow ICMP (ping) - IPv4 and IPv6
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # Allow SSH
        tcp dport 22 accept

        ########################
        ## Currently not using:
        # # Allow HTTP and HTTPS
        # tcp dport { 80, 443 } accept

        # Allow serving DHCP over ethernet
        iifname enp191s0 udp dport 67 accept
        iifname enp191s0 udp sport 67 accept
        ########################
	}
    chain forward {
        type filter hook forward priority filter;
        policy drop;

        # drop invalid
        ct state invalid drop

        # allow LAN -> WAN
        iifname enp191s0 oifname wlp192s0 accept

        # allow established/related back
        iifname wlp192s0 oifname enp191s0 ct state established,related accept
    }
	chain output {
		type filter hook output priority filter;
        policy accept;
	}
}

table inet nat {
    chain postrouting {
        # priority srcnat = 100
        type nat hook postrouting priority srcnat;
        oifname wlp192s0 masquerade
    }
}
